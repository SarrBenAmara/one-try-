<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <meta name="theme-color" content="#f4f1e9">
  <title>SparkLab | Interactive Science Challenge</title>
  <style>
    :root {
      --ink:#11263f; --paper:#f4f1e9; --surface:#fffdf8; --line:#d9d7cf;
      --blue:#5573e8; --mint:#75d8c6; --yellow:#ffd44d; --red:#dc4b52;
      --accent:#ff704d;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-width:320px; min-height:100%; }
    body {
      color:var(--ink); background:var(--paper);
      font-family:Arial,Helvetica,sans-serif;
    }
    button,input,textarea { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    button:focus-visible,input:focus-visible,textarea:focus-visible {
      outline:4px solid var(--yellow); outline-offset:3px;
    }
    .app {
      min-height:100vh; overflow:hidden;
      background:
        radial-gradient(circle at 5% 92%,rgba(117,216,198,.18),transparent 27rem),
        radial-gradient(circle at 92% 10%,rgba(255,112,77,.14),transparent 23rem),
        var(--paper);
    }
    .topbar {
      min-height:78px; padding:12px clamp(16px,3.5vw,54px);
      display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
      border-bottom:1px solid rgba(17,38,63,.12);
      background:rgba(244,241,233,.92); position:relative; z-index:5;
    }
    .brand {
      width:max-content; padding:0; border:0; background:transparent;
      display:flex; align-items:center; gap:12px; color:var(--ink);
      font-size:20px; font-weight:900; cursor:pointer;
    }
    .brand-mark {
      width:44px; height:44px; display:grid; place-items:center;
      border-radius:14px 14px 14px 5px; color:#fff; background:var(--ink);
      transform:rotate(-3deg);
    }
    .question-count {
      min-width:180px; padding:10px 18px; border:1px solid rgba(17,38,63,.14);
      border-radius:999px; background:var(--surface); text-align:center; font-weight:900;
    }
    .header-actions { justify-self:end; display:flex; gap:9px; }
    .icon-btn {
      width:48px; height:48px; border:1px solid rgba(17,38,63,.16);
      border-radius:15px; color:var(--ink); background:var(--surface);
      font-size:22px; font-weight:900; cursor:pointer;
    }
    .icon-btn.dark { color:#fff; border-color:var(--ink); background:var(--ink); }
    .progress { height:7px; background:#dfddd7; }
    .progress > div { height:100%; width:0; background:var(--accent); transition:width .35s; }
    .screen { width:min(1320px,calc(100% - 38px)); margin:auto; }

    .welcome {
      min-height:calc(100vh - 78px); padding:clamp(38px,6vh,75px) 2vw 32px;
      display:grid; grid-template-columns:minmax(300px,.9fr) minmax(450px,1.15fr);
      align-items:center; gap:clamp(38px,6vw,95px);
    }
    .welcome-copy { grid-column:2; grid-row:1; max-width:690px; }
    .eyebrow {
      margin:0 0 16px; color:var(--accent); font-size:14px;
      font-weight:900; letter-spacing:.18em;
    }
    h1 { margin:0; font-size:clamp(52px,7.2vw,98px); line-height:.92; letter-spacing:-.07em; }
    .subtitle { margin:24px 0 0; color:#56667a; font-size:clamp(19px,2vw,27px); }
    .stats { margin:28px 0 20px; display:flex; flex-wrap:wrap; gap:9px; }
    .pill {
      padding:9px 14px; border:1px solid rgba(17,38,63,.13);
      border-radius:999px; background:rgba(255,253,248,.72);
      font-size:14px; font-weight:900;
    }
    .pill.on { color:#0b6855; border-color:#9edcca; background:#dff8f1; }
    .pill.on::before {
      content:""; width:8px; height:8px; margin-right:7px; display:inline-block;
      border-radius:50%; background:#16866f;
    }
    .name-field { width:min(430px,100%); display:grid; gap:7px; color:#445368; font-size:13px; font-weight:900; }
    .name-field input {
      min-height:58px; padding:12px 16px; border:3px solid var(--ink);
      border-radius:17px; color:var(--ink); background:var(--surface);
      box-shadow:0 5px 0 rgba(17,38,63,.13); font-size:18px; font-weight:800;
    }
    .field-error { min-height:18px; margin:5px 0 0; color:#a32f39; font-size:13px; }
    .welcome-actions { width:min(430px,100%); margin-top:14px; display:grid; gap:10px; }
    .primary,.secondary,.next-btn {
      min-height:62px; padding:0 24px; border:0; border-radius:18px;
      font-weight:900; cursor:pointer;
    }
    .primary,.next-btn { color:#fff; background:var(--ink); box-shadow:0 7px 0 rgba(17,38,63,.15); }
    .secondary { color:var(--ink); border:2px solid var(--ink); background:transparent; }
    .customize-link { min-height:42px; border:0; color:var(--ink); background:transparent; font-weight:900; cursor:pointer; }
    .customize-link span { margin-right:8px; color:var(--accent); }
    .orbit-art {
      grid-column:1; grid-row:1; width:min(37vw,460px); aspect-ratio:1;
      justify-self:center; display:grid; place-items:center; position:relative;
    }
    .nucleus {
      width:43%; aspect-ratio:1; display:grid; place-items:center;
      border:8px solid var(--ink); border-radius:50%; background:var(--yellow);
      box-shadow:14px 14px 0 rgba(17,38,63,.12); font-size:clamp(68px,8vw,112px);
      transform:rotate(-7deg); z-index:2;
    }
    .orbit { width:95%; height:40%; border:4px solid var(--ink); border-radius:50%; position:absolute; }
    .orbit.a { transform:rotate(24deg); } .orbit.b { transform:rotate(-42deg); }
    .particle { width:42px; aspect-ratio:1; border:5px solid var(--ink); border-radius:50%; position:absolute; z-index:3; }
    .p1 { left:6%; top:35%; background:var(--accent); }
    .p2 { right:5%; top:30%; background:var(--mint); }
    .p3 { bottom:7%; left:54%; background:var(--blue); }

    .game { min-height:calc(100vh - 85px); padding:20px 0 26px; display:grid; grid-template-rows:auto auto 1fr auto; gap:17px; }
    .score-row { display:flex; justify-content:center; gap:14px; }
    .team {
      min-width:220px; min-height:60px; padding:8px 16px; display:flex;
      align-items:center; justify-content:space-between; border:3px solid transparent;
      border-radius:17px; color:var(--ink); background:var(--surface);
      box-shadow:0 3px 12px rgba(17,38,63,.08); font-weight:900; cursor:pointer;
    }
    .team.active { border-color:var(--ink); background:#e8edff; }
    .team strong { font-size:32px; }
    .question-panel {
      max-width:1120px; margin:auto; display:grid; grid-template-columns:78px 1fr;
      grid-template-rows:auto auto; column-gap:22px; align-items:center;
    }
    .question-icon {
      grid-row:1/3; width:78px; height:78px; display:grid; place-items:center;
      border:5px solid var(--ink); border-radius:24px 24px 24px 8px;
      background:var(--yellow); font-size:36px; font-weight:900; transform:rotate(-3deg);
    }
    .turn { margin:0 0 5px; color:var(--accent); font-size:13px; font-weight:900; letter-spacing:.1em; }
    h2 { margin:0; font-size:clamp(28px,3.4vw,49px); line-height:1.08; letter-spacing:-.045em; }
    .answers { width:min(1180px,100%); margin:auto; align-self:center; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .answer {
      min-height:112px; padding:17px 22px; display:grid; grid-template-columns:52px 1fr auto;
      align-items:center; gap:17px; border:3px solid var(--ink); border-radius:23px;
      color:var(--ink); background:var(--surface); box-shadow:0 7px 0 rgba(17,38,63,.14);
      text-align:left; cursor:pointer;
    }
    .answer-key {
      width:52px; height:52px; display:grid; place-items:center;
      border:2px solid var(--ink); border-radius:15px; background:#dbe1ff;
      font-size:21px; font-weight:900;
    }
    .answer-text { font-size:clamp(19px,2vw,26px); font-weight:900; }
    .answer.correct { border-color:#147c64; background:#e0f8f1; }
    .answer.wrong { border-color:var(--red); background:#fff0f1; }
    .answer.muted { opacity:.46; }
    .answer-status {
      width:43px; height:43px; display:grid; place-items:center;
      border-radius:50%; color:#fff; background:#147c64; font-size:27px; font-weight:900;
    }
    .answer.wrong .answer-status { background:var(--red); }
    .feedback {
      width:min(1180px,100%); min-height:84px; margin:auto; padding:13px 15px 13px 18px;
      display:grid; grid-template-columns:48px 1fr auto; align-items:center; gap:15px;
      border-radius:20px; background:#d5f5ec;
    }
    .feedback.retry { color:#7b2730; background:#ffe4e6; }
    .feedback-badge {
      width:46px; height:46px; display:grid; place-items:center;
      border:3px solid currentColor; border-radius:50%; font-size:24px; font-weight:900;
    }
    .feedback p { margin:3px 0 0; font-size:14px; }
    .next-btn { min-width:190px; }

    .complete { min-height:calc(100vh - 78px); padding:34px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .trophy {
      width:108px; height:108px; margin-bottom:20px; display:grid; place-items:center;
      border:7px solid var(--ink); border-radius:35px 35px 35px 11px;
      background:var(--yellow); box-shadow:10px 10px 0 rgba(17,38,63,.12);
      font-size:54px; transform:rotate(-5deg);
    }
    .complete h1 { font-size:clamp(46px,6.5vw,82px); }
    .complete-sub { max-width:650px; margin:18px auto 22px; color:#5b6a7e; font-size:19px; }
    .final-score { display:flex; gap:16px; }
    .final-score div {
      min-width:175px; padding:14px 22px; border:3px solid var(--ink);
      border-radius:19px; background:var(--surface);
    }
    .final-score strong { display:block; font-size:39px; }
    .email-status {
      width:min(680px,100%); margin:22px auto 0; padding:14px 17px;
      display:grid; grid-template-columns:43px 1fr auto; align-items:center; gap:13px;
      border:2px solid rgba(17,38,63,.16); border-radius:18px;
      background:var(--surface); text-align:left;
    }
    .email-icon { width:42px; height:42px; display:grid; place-items:center; border-radius:13px 13px 13px 5px; color:#fff; background:var(--blue); font-weight:900; }
    .email-status p { margin:3px 0 0; color:#5b697b; font-size:13px; }
    .email-status.sent { border-color:#16866f; background:#e0f8f1; }
    .email-status.sent .email-icon { background:#16866f; }
    .email-status.error,.email-status.activation { border-color:#d99b20; background:#fff4c9; }
    .retry-btn { min-height:42px; padding:0 14px; border:2px solid var(--ink); border-radius:11px; background:#fff; font-weight:900; cursor:pointer; }
    .complete-actions { margin-top:24px; display:flex; gap:12px; }

    .modal-bg { position:fixed; inset:0; z-index:20; padding:24px; display:grid; place-items:center; background:rgba(7,22,39,.7); }
    .modal {
      width:min(1080px,100%); height:min(900px,calc(100vh - 38px));
      display:grid; grid-template-rows:auto 1fr auto; overflow:hidden;
      border:4px solid var(--ink); border-radius:27px; background:var(--paper);
    }
    .modal-head,.modal-foot { padding:19px 28px; display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--surface); }
    .modal-head { border-bottom:2px solid rgba(17,38,63,.14); }
    .modal-head h2 { font-size:38px; }
    .close { width:48px; height:48px; border:2px solid var(--ink); border-radius:15px; background:transparent; font-size:30px; cursor:pointer; }
    .modal-body { padding:24px 30px 36px; overflow:auto; }
    .meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .editor-label { display:grid; gap:6px; color:#445368; font-size:13px; font-weight:900; }
    .editor-label.full { grid-column:1/-1; }
    .editor-label input,.editor-label textarea {
      width:100%; min-height:48px; padding:10px 12px; border:2px solid #c9cbc8;
      border-radius:12px; color:var(--ink); background:var(--surface); font-weight:700;
    }
    .editor-label textarea { resize:vertical; }
    .question-edit { margin-top:16px; padding:20px; display:grid; gap:14px; border:2px solid rgba(17,38,63,.16); border-radius:18px; background:var(--surface); }
    .question-edit-head { display:flex; justify-content:space-between; }
    .remove { border:0; border-radius:9px; color:#a3303a; background:#ffe4e6; font-weight:900; cursor:pointer; }
    .choice-edit { display:grid; grid-template-columns:24px 30px 1fr; align-items:center; gap:7px; }
    .choice-edit input[type=text] { min-height:44px; padding:8px 10px; border:2px solid #c9cbc8; border-radius:11px; font-weight:700; }
    .add-btn { width:100%; min-height:56px; margin-top:15px; border:2px dashed #7d8998; border-radius:14px; background:transparent; font-weight:900; cursor:pointer; }
    .modal-foot { border-top:2px solid rgba(17,38,63,.14); }
    .modal-foot div { display:flex; gap:10px; }
    .hidden { display:none !important; }

    @media(max-width:900px) {
      .welcome { grid-template-columns:1fr; text-align:center; }
      .welcome-copy,.orbit-art { grid-column:1; }
      .welcome-copy { grid-row:1; justify-self:center; }
      .orbit-art { grid-row:2; width:min(68vw,420px); }
      .stats { justify-content:center; }
      .name-field,.welcome-actions { margin-inline:auto; }
    }
    @media(max-width:700px) {
      .topbar { grid-template-columns:auto 1fr auto; padding:10px 13px; }
      .brand span:last-child,.sound-btn { display:none; }
      .question-count { min-width:0; justify-self:center; font-size:13px; }
      .answers { grid-template-columns:1fr; }
      .answer { min-height:85px; }
      .score-row { gap:8px; }
      .team { min-width:45vw; }
      .feedback { grid-template-columns:44px 1fr; }
      .next-btn { grid-column:1/-1; }
      .final-score,.complete-actions { width:100%; flex-direction:column; }
      .final-score div,.complete-actions button { width:100%; }
      .email-status { grid-template-columns:42px 1fr; }
      .retry-btn { grid-column:1/-1; }
      .modal-bg { padding:0; }
      .modal { height:100vh; border:0; border-radius:0; }
      .meta-grid { grid-template-columns:1fr; }
      .editor-label.full { grid-column:1; }
      .modal-foot { flex-direction:column-reverse; }
      .modal-foot div,.modal-foot button { width:100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="brand" id="homeBtn" aria-label="Return to start">
        <span class="brand-mark">S</span><span>SparkLab</span>
      </button>
      <div class="question-count hidden" id="questionCount"></div>
      <div class="header-actions">
        <button class="icon-btn dark" id="editBtn" title="Customize activity" aria-label="Customize activity">✎</button>
        <button class="icon-btn sound-btn" id="soundBtn" title="Sound" aria-label="Toggle sound">♪</button>
        <button class="icon-btn" id="fullBtn" title="Full screen" aria-label="Full screen">⛶</button>
      </div>
    </header>
    <div class="progress hidden" id="progress"><div id="progressFill"></div></div>
    <div id="screen"></div>
  </main>

  <div class="modal-bg hidden" id="modalBg">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div><p class="eyebrow">TEACHER CONTROLS</p><h2 id="modalTitle">Build your activity</h2></div>
        <button class="close" id="closeModal" aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <div class="meta-grid">
          <label class="editor-label">Small heading<input id="editEyebrow"></label>
          <label class="editor-label">Activity title<input id="editTitle"></label>
          <label class="editor-label full">Topic line<input id="editSubtitle"></label>
          <label class="editor-label">Accent colour<input id="editAccent" type="color"></label>
        </div>
        <div id="questionEditors"></div>
        <button class="add-btn" id="addQuestion">+ Add another question</button>
      </div>
      <footer class="modal-foot">
        <button class="customize-link" id="resetLesson">Restore particle sample</button>
        <div>
          <button class="secondary" id="cancelModal">Cancel</button>
          <button class="primary" id="saveLesson">Save activity ✓</button>
        </div>
      </footer>
    </section>
  </div>

  <script>
    "use strict";

    const RESULT_EMAIL = "sarahinoubli@gmail.com";
    const STORAGE_KEY = "sparklab-github-lesson";
    const KEYS = ["A","B","C","D"];

    const SAMPLE = {
      eyebrow:"MRS. SARRA’S SCIENCE LAB",
      title:"Particle Challenge",
      subtitle:"States of matter • Cambridge science",
      accent:"#ff704d",
      questions:[
        {id:"p1",icon:"☀",prompt:"What happens to particles when a solid is heated?",choices:["They move faster","They disappear","They become heavier","They stop moving"],correct:0,explanation:"Heating gives particles more energy, so they vibrate and move faster."},
        {id:"p2",icon:"▦",prompt:"Which state has particles packed closely in a regular pattern?",choices:["Gas","Liquid","Solid","Plasma"],correct:2,explanation:"In a solid, particles are closely packed and held in fixed positions."},
        {id:"p3",icon:"✦",prompt:"How do gas particles usually move?",choices:["Only up and down","Freely in all directions","In fixed positions","In a perfect circle"],correct:1,explanation:"Gas particles are far apart and move quickly in every direction."},
        {id:"p4",icon:"↗",prompt:"In which state does diffusion usually happen fastest?",choices:["Solids","Liquids","Gases","All at the same speed"],correct:2,explanation:"Diffusion is fastest in gases because their particles move quickly and are far apart."},
        {id:"p5",icon:"◒",prompt:"A solid changes into a liquid. What is this change called?",choices:["Freezing","Condensing","Evaporating","Melting"],correct:3,explanation:"Melting happens when a solid gains enough energy to become a liquid."},
        {id:"p6",icon:"≈",prompt:"Which statement about liquid particles is correct?",choices:["They are fixed in place","They can slide past each other","They have no energy","They are very far apart"],correct:1,explanation:"Liquid particles stay close together, but they can move and slide past one another."}
      ]
    };

    const clone = value => JSON.parse(JSON.stringify(value));
    let lesson = clone(SAMPLE);
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.questions && saved.questions.length) lesson = saved;
    } catch (_) {}

    let screenName = "welcome", studentName = "", questionIndex = 0, selected = null;
    let answers = [], activeTeam = "A", scores = {A:0,B:0}, soundOn = true;
    let emailState = "idle", draft = clone(lesson);

    const screen = document.getElementById("screen");
    const questionCount = document.getElementById("questionCount");
    const progress = document.getElementById("progress");
    const progressFill = document.getElementById("progressFill");
    const modalBg = document.getElementById("modalBg");
    document.documentElement.style.setProperty("--accent",lesson.accent);

    function setChrome(show,count=0) {
      questionCount.classList.toggle("hidden",!show);
      progress.classList.toggle("hidden",!show);
      if (show) {
        questionCount.textContent = `Question ${questionIndex+1} / ${lesson.questions.length}`;
        progressFill.style.width = `${count}%`;
      }
    }

    function renderWelcome(error="") {
      screenName = "welcome"; setChrome(false);
      document.documentElement.style.setProperty("--accent",lesson.accent);
      screen.innerHTML = `
        <section class="screen welcome">
          <div class="orbit-art" aria-hidden="true">
            <span class="orbit a"></span><span class="orbit b"></span>
            <span class="nucleus">⚛</span>
            <span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span>
          </div>
          <div class="welcome-copy">
            <p class="eyebrow">${escapeHtml(lesson.eyebrow)}</p>
            <h1>${escapeHtml(lesson.title)}</h1>
            <p class="subtitle">${escapeHtml(lesson.subtitle)}</p>
            <div class="stats">
              <span class="pill">${lesson.questions.length} questions</span>
              <span class="pill">2 teams</span><span class="pill">≈ 8 minutes</span>
              <span class="pill on">Results email on</span>
            </div>
            <label class="name-field">
              Student name
              <input id="studentInput" value="${escapeAttr(studentName)}" placeholder="Type your name" autocomplete="name">
            </label>
            <p class="field-error" id="nameError">${escapeHtml(error)}</p>
            <div class="welcome-actions">
              <button class="primary" id="startBtn">Start class challenge →</button>
              <button class="customize-link" id="welcomeEdit"><span>✎</span>Customize this activity</button>
            </div>
          </div>
        </section>`;
      const input = document.getElementById("studentInput");
      input.addEventListener("input",e => { studentName=e.target.value; document.getElementById("nameError").textContent=""; });
      input.addEventListener("keydown",e => { if(e.key==="Enter") startGame(); });
      document.getElementById("startBtn").onclick=startGame;
      document.getElementById("welcomeEdit").onclick=openEditor;
    }

    function startGame() {
      const input = document.getElementById("studentInput");
      if (input) studentName=input.value;
      if (!studentName.trim()) { renderWelcome("Enter your name before starting."); return; }
      questionIndex=0; selected=null; answers=lesson.questions.map(()=>null);
      activeTeam="A"; scores={A:0,B:0}; emailState="idle"; renderQuestion();
    }

    function renderQuestion() {
      screenName="play";
      const q=lesson.questions[questionIndex];
      const answered=selected!==null;
      setChrome(true,((questionIndex+(answered?1:0))/lesson.questions.length)*100);
      screen.innerHTML=`
        <section class="screen game">
          <div class="score-row">
            ${["A","B"].map(team=>`<button class="team ${activeTeam===team?"active":""}" data-team="${team}"><span>Team ${team}</span><strong>${scores[team]}</strong></button>`).join("")}
          </div>
          <div class="question-panel">
            <div class="question-icon">${escapeHtml(q.icon||"?")}</div>
            <p class="turn">TEAM ${activeTeam} • CHOOSE ONE ANSWER</p>
            <h2>${escapeHtml(q.prompt)}</h2>
          </div>
          <div class="answers">
            ${q.choices.map((choice,i)=>{
              const correct=answered&&i===q.correct, wrong=answered&&i===selected&&!correct;
              const muted=answered&&!correct&&!wrong;
              return `<button class="answer ${correct?"correct":""} ${wrong?"wrong":""} ${muted?"muted":""}" data-answer="${i}" ${answered?"disabled":""}>
                <span class="answer-key">${KEYS[i]}</span><span class="answer-text">${escapeHtml(choice)}</span>
                ${correct?'<span class="answer-status">✓</span>':wrong?'<span class="answer-status">×</span>':""}
              </button>`;
            }).join("")}
          </div>
          ${answered?`
            <div class="feedback ${selected===q.correct?"":"retry"}">
              <div class="feedback-badge">${selected===q.correct?"✓":"!"}</div>
              <div><strong>${selected===q.correct?"Exactly right!":"Good try — let’s learn it."}</strong><p>${escapeHtml(q.explanation)}</p></div>
              <button class="next-btn" id="nextBtn">${questionIndex===lesson.questions.length-1?"See results":"Next question"} →</button>
            </div>`:""}
        </section>`;
      document.querySelectorAll("[data-team]").forEach(btn=>btn.onclick=()=>{if(!answered){activeTeam=btn.dataset.team;renderQuestion();}});
      document.querySelectorAll("[data-answer]").forEach(btn=>btn.onclick=()=>chooseAnswer(Number(btn.dataset.answer)));
      if(answered) document.getElementById("nextBtn").onclick=nextQuestion;
    }

    function chooseAnswer(index) {
      if(selected!==null)return;
      selected=index; answers[questionIndex]=index;
      const correct=index===lesson.questions[questionIndex].correct;
      if(correct)scores[activeTeam]++;
      if(soundOn)playTone(correct);
      renderQuestion();
    }

    function nextQuestion() {
      if(selected===null)return;
      if(questionIndex===lesson.questions.length-1){renderComplete();sendResults();return;}
      questionIndex++; selected=null; activeTeam=activeTeam==="A"?"B":"A"; renderQuestion();
    }

    function renderComplete() {
      screenName="complete"; setChrome(false);
      const total=answers.filter((answer,i)=>answer===lesson.questions[i].correct).length;
      const winner=scores.A===scores.B?"It’s a tie!":`Team ${scores.A>scores.B?"A":"B"} wins!`;
      screen.innerHTML=`
        <section class="screen complete">
          <p class="eyebrow">CHALLENGE COMPLETE</p><div class="trophy">★</div>
          <h1>${winner}</h1>
          <p class="complete-sub">Great thinking, ${escapeHtml(studentName)}. You scored ${total} out of ${lesson.questions.length}.</p>
          <div class="final-score"><div>Team A<strong>${scores.A}</strong></div><div>Team B<strong>${scores.B}</strong></div></div>
          <div id="emailBox"></div>
          <div class="complete-actions">
            <button class="primary" id="againBtn">Play again ↻</button>
            <button class="secondary" id="backBtn">Back to start</button>
          </div>
        </section>`;
      document.getElementById("againBtn").onclick=startGame;
      document.getElementById("backBtn").onclick=()=>renderWelcome();
      renderEmailStatus();
    }

    function renderEmailStatus() {
      const box=document.getElementById("emailBox"); if(!box)return;
      const data={
        idle:["!","Preparing the report…","The quiz will send automatically."],
        sending:["↗","Emailing the full report…","Keep this page open for a moment."],
        sent:["✓","Report emailed","The score and every answer were sent to Mrs. Sarra."],
        activation:["✉","One-time activation needed","Open the activation email, then tap Retry email."],
        error:["!","The report has not sent yet","Check the connection and tap Retry email."]
      }[emailState];
      box.innerHTML=`<div class="email-status ${emailState}">
        <span class="email-icon">${data[0]}</span><div><strong>${data[1]}</strong><p>${data[2]}</p></div>
        ${["activation","error"].includes(emailState)?'<button class="retry-btn" id="retryEmail">Retry email</button>':""}
      </div>`;
      const retry=document.getElementById("retryEmail"); if(retry)retry.onclick=sendResults;
    }

    async function sendResults() {
      emailState="sending"; renderEmailStatus();
      const total=answers.filter((answer,i)=>answer===lesson.questions[i].correct).length;
      const fullReport=lesson.questions.map((q,i)=>`${i+1}. ${q.prompt}\nStudent answer: ${q.choices[answers[i]]||"No answer"}\nCorrect answer: ${q.choices[q.correct]}\nResult: ${answers[i]===q.correct?"Correct":"Incorrect"}\nExplanation: ${q.explanation}`).join("\n\n");
      try {
        const response=await fetch(`https://formsubmit.co/ajax/${RESULT_EMAIL}`,{
          method:"POST",
          headers:{"Content-Type":"application/json","Accept":"application/json"},
          body:JSON.stringify({
            _subject:`SparkLab result — ${studentName} — ${lesson.title}`,
            _template:"table",_captcha:"false",
            Student:studentName,Quiz:lesson.title,Score:`${total} / ${lesson.questions.length}`,
            "Team A score":scores.A,"Team B score":scores.B,
            Completed:new Date().toLocaleString("en-GB"),
            "Full answer report":fullReport
          })
        });
        const data=await response.json().catch(()=>({}));
        const message=String(data.message||"");
        emailState=/activat|confirm|verify/i.test(message)?"activation":response.ok?"sent":"error";
      } catch (_) { emailState="error"; }
      renderEmailStatus();
    }

    function openEditor() {
      draft=clone(lesson);
      document.getElementById("editEyebrow").value=draft.eyebrow;
      document.getElementById("editTitle").value=draft.title;
      document.getElementById("editSubtitle").value=draft.subtitle;
      document.getElementById("editAccent").value=draft.accent;
      renderEditors(); modalBg.classList.remove("hidden");
    }
    function closeEditor(){modalBg.classList.add("hidden");}
    function renderEditors() {
      document.getElementById("questionEditors").innerHTML=draft.questions.map((q,qi)=>`
        <article class="question-edit">
          <div class="question-edit-head"><strong>Question ${qi+1}</strong>${draft.questions.length>1?`<button class="remove" data-remove="${qi}">Remove</button>`:""}</div>
          <label class="editor-label">Question<textarea rows="2" data-prompt="${qi}">${escapeHtml(q.prompt)}</textarea></label>
          ${q.choices.map((choice,ci)=>`<label class="choice-edit"><input type="radio" name="correct-${qi}" data-correct="${qi}" value="${ci}" ${q.correct===ci?"checked":""}><strong>${KEYS[ci]}</strong><input type="text" data-choice="${qi}-${ci}" value="${escapeAttr(choice)}"></label>`).join("")}
          <label class="editor-label">Explanation<textarea rows="2" data-explanation="${qi}">${escapeHtml(q.explanation)}</textarea></label>
        </article>`).join("");
      document.querySelectorAll("[data-remove]").forEach(btn=>btn.onclick=()=>{syncDraft();draft.questions.splice(Number(btn.dataset.remove),1);renderEditors();});
    }
    function syncDraft() {
      draft.eyebrow=document.getElementById("editEyebrow").value.trim()||"SCIENCE CLASSROOM";
      draft.title=document.getElementById("editTitle").value.trim()||"Science Challenge";
      draft.subtitle=document.getElementById("editSubtitle").value.trim()||"Interactive class activity";
      draft.accent=document.getElementById("editAccent").value;
      document.querySelectorAll("[data-prompt]").forEach(el=>draft.questions[Number(el.dataset.prompt)].prompt=el.value);
      document.querySelectorAll("[data-explanation]").forEach(el=>draft.questions[Number(el.dataset.explanation)].explanation=el.value);
      document.querySelectorAll("[data-choice]").forEach(el=>{const [q,c]=el.dataset.choice.split("-").map(Number);draft.questions[q].choices[c]=el.value;});
      document.querySelectorAll("[data-correct]:checked").forEach(el=>draft.questions[Number(el.dataset.correct)].correct=Number(el.value));
    }
    function saveEditor(){syncDraft();lesson=clone(draft);localStorage.setItem(STORAGE_KEY,JSON.stringify(lesson));closeEditor();renderWelcome();}

    function playTone(correct) {
      try {
        const Ctx=window.AudioContext||window.webkitAudioContext,ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=correct?620:190;
        gain.gain.setValueAtTime(.1,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);
        osc.start();osc.stop(ctx.currentTime+.26);
      } catch(_){}
    }
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
    function escapeAttr(value){return escapeHtml(value);}

    document.getElementById("homeBtn").onclick=()=>renderWelcome();
    document.getElementById("editBtn").onclick=openEditor;
    document.getElementById("soundBtn").onclick=()=>{soundOn=!soundOn;document.getElementById("soundBtn").textContent=soundOn?"♪":"×♪";};
    document.getElementById("fullBtn").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    document.getElementById("closeModal").onclick=closeEditor;
    document.getElementById("cancelModal").onclick=closeEditor;
    document.getElementById("saveLesson").onclick=saveEditor;
    document.getElementById("resetLesson").onclick=()=>{draft=clone(SAMPLE);document.getElementById("editEyebrow").value=draft.eyebrow;document.getElementById("editTitle").value=draft.title;document.getElementById("editSubtitle").value=draft.subtitle;document.getElementById("editAccent").value=draft.accent;renderEditors();};
    document.getElementById("addQuestion").onclick=()=>{syncDraft();draft.questions.push({id:"q"+Date.now(),icon:"?",prompt:"Write your question here",choices:["Answer one","Answer two","Answer three","Answer four"],correct:0,explanation:"Add a short explanation."});renderEditors();};
    document.addEventListener("keydown",e=>{
      if(!modalBg.classList.contains("hidden"))return;
      if(screenName==="play"&&["1","2","3","4"].includes(e.key))chooseAnswer(Number(e.key)-1);
      if(screenName==="play"&&selected!==null&&(e.key==="Enter"||e.key.toLowerCase()==="n"))nextQuestion();
      if(e.key.toLowerCase()==="f")document.getElementById("fullBtn").click();
    });
    renderWelcome();
  </script>
</body>
</html>
